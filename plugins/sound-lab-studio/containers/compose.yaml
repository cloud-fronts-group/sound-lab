# Sound Lab containers. Start the MLX audio service with one of:
#   docker compose --profile cpu up -d mlx-audio-cpu        # any host (CPU MLX)
#   docker compose --profile cuda up -d mlx-audio-cuda      # Linux + NVIDIA (mlx[cuda12])
# The MCP server finds it at http://127.0.0.1:8000 (setting mlx_mode = external, or docker to let it manage the container).
services:
  mlx-audio-cpu:
    profiles: ["cpu"]
    build: { context: ./mlx-audio, args: { MLX_EXTRA: cpu } }
    image: ghcr.io/cloud-fronts-group/sound-lab-mlx-audio:cpu
    ports: ["127.0.0.1:8000:8000"]
    volumes: ["${HOME}/.cache/huggingface:/root/.cache/huggingface"]
    restart: unless-stopped
  mlx-audio-cuda:
    profiles: ["cuda"]
    build: { context: ./mlx-audio, args: { MLX_EXTRA: cuda12 } }
    image: ghcr.io/cloud-fronts-group/sound-lab-mlx-audio:cuda12
    ports: ["127.0.0.1:8000:8000"]
    volumes: ["${HOME}/.cache/huggingface:/root/.cache/huggingface"]
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices: [{ driver: nvidia, count: all, capabilities: [gpu] }]
  ffmpeg:
    profiles: ["build"]
    build: ./ffmpeg
    image: ghcr.io/cloud-fronts-group/sound-lab-ffmpeg:latest
  whisper-vulkan:
    profiles: ["build"]
    build: ./whisper-vulkan
    image: ghcr.io/cloud-fronts-group/sound-lab-whisper-vulkan:latest
