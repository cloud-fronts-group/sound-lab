# Sound Lab containers. Start the MLX audio service (CPU, mlx[cpu]) with:
#   docker compose --profile cpu up -d mlx-audio-cpu
# The MCP server finds it at http://127.0.0.1:8000 (setting mlx_mode = external, or docker to let it manage the container).
# For the Apple GPU, run mlx_audio.server natively on the Mac instead (mlx_mode = native).
services:
  mlx-audio-cpu:
    profiles: ["cpu"]
    build: ./mlx-audio
    image: ghcr.io/cloud-fronts-group/sound-lab-mlx-audio:cpu
    ports: ["127.0.0.1:8000:8000"]
    volumes: ["${HOME}/.cache/huggingface:/root/.cache/huggingface"]
    restart: unless-stopped
  ffmpeg:
    profiles: ["build"]
    build: ./ffmpeg
    image: ghcr.io/cloud-fronts-group/sound-lab-ffmpeg:latest
  whisper-vulkan:
    profiles: ["build"]
    build: ./whisper-vulkan
    image: ghcr.io/cloud-fronts-group/sound-lab-whisper-vulkan:latest
