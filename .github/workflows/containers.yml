name: Build Sound Lab containers
on:
  push:
    branches: [main]
    paths: ["plugins/sound-lab-studio/containers/**", ".github/workflows/containers.yml"]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: sound-lab-mlx-audio, tag: cpu,    context: mlx-audio,      args: "MLX_EXTRA=cpu",    platforms: "linux/amd64,linux/arm64" }
          - { name: sound-lab-mlx-audio, tag: cuda12, context: mlx-audio,      args: "MLX_EXTRA=cuda12", platforms: "linux/amd64" }
          - { name: sound-lab-ffmpeg,    tag: latest, context: ffmpeg,         args: "",                 platforms: "linux/amd64,linux/arm64" }
          - { name: sound-lab-whisper-vulkan, tag: latest, context: whisper-vulkan, args: "",           platforms: "linux/amd64,linux/arm64" }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - uses: docker/build-push-action@v6
        with:
          context: plugins/sound-lab-studio/containers/${{ matrix.context }}
          build-args: ${{ matrix.args }}
          platforms: ${{ matrix.platforms }}
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}:${{ matrix.tag }}
          cache-from: type=gha,scope=${{ matrix.name }}-${{ matrix.tag }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}-${{ matrix.tag }}
